name: tests

on: push

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: set up go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: running unit-tests
        run: |
          go test -v ./...
